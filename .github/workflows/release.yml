name: release

on:
  create:
    tags:
      - v*

env:
  APP_IMAGE_NAME: alexamuek/devops-example-app
  CADDY_IMAGE_NAME: alexamuek/devops-example-caddy

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: false

      - name: Pull and tag app image
        run: |
          docker pull ${{ env.APP_IMAGE_NAME }}:latest
          docker tag ${{ env.APP_IMAGE_NAME }}:latest ${{ env.APP_IMAGE_NAME }}:${{ github.ref_name }}
          docker push ${{ env.APP_IMAGE_NAME }}:${{ github.ref_name }}

      - name: Pull and tag caddy image
        run: |
          docker pull ${{ env.CADDY_IMAGE_NAME }}:latest
          docker tag ${{ env.CADDY_IMAGE_NAME }}:latest ${{ env.CADDY_IMAGE_NAME }}:${{ github.ref_name }}
          docker push ${{ env.CADDY_IMAGE_NAME }}:${{ github.ref_name }}