name: release

on:
  create:
    tags:
      - v*

env:
  # Изменено на ваше имя пользователя
  APP_IMAGE_NAME: alexamuek/devops-example-app
  CADDY_IMAGE_NAME: alexamuek/devops-example-caddy

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # Эти шаги нужны для работы с Docker
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          # Используем правильные имена секретов
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Тегируем и пушим образ приложения с тегом версии
      - name: Tag and push app image
        run: |
          docker pull ${{ env.APP_IMAGE_NAME }}:latest
          docker tag ${{ env.APP_IMAGE_NAME }}:latest ${{ env.APP_IMAGE_NAME }}:${{ github.ref_name }}
          docker push ${{ env.APP_IMAGE_NAME }}:${{ github.ref_name }}

      # Тегируем и пушим образ Caddy с тегом версии
      - name: Tag and push caddy image
        run: |
          docker pull ${{ env.CADDY_IMAGE_NAME }}:latest
          docker tag ${{ env.CADDY_IMAGE_NAME }}:latest ${{ env.CADDY_IMAGE_NAME }}:${{ github.ref_name }}
          docker push ${{ env.CADDY_IMAGE_NAME }}:${{ github.ref_name }}
