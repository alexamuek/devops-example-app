services:
  app:
    env_file: .env
    volumes:
      - .:/app
    ports:
      - 3000:3000

  caddy:
    # Use the host network locally to avoid a broken Docker bridge connection
    # between Caddy and the app container. Caddy proxies to localhost:3000.
    network_mode: host
    volumes:
      - .:/app
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile.local

  bugsink:
    image: bugsink/bugsink:latest
    ports:
      - 8000:8000
    environment:
      - SECRET_KEY=localdev-hexlet-devops-example-app-not-for-production-use
      - ALLOWED_HOSTS=localhost,bugsink
      - CREATE_SUPERUSER=admin@example.com:admin
